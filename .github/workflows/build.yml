name: Sync Binaries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get cloudflared latest release tag
        id: cloudflared_tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download official binaries
        run: |
          TAG="${{ steps.cloudflared_tag.outputs.tag }}"
          echo "Downloading cloudflared version $TAG"
          curl -Lo bot-linux-amd64 "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-amd64"
          curl -Lo bot-linux-arm64 "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-arm64"
          chmod +x bot-linux-amd64 bot-linux-arm64

      - name: Delete existing release
        run: |
          TAG="${{ steps.cloudflared_tag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cloudflared_tag.outputs.tag }}
          name: ${{ steps.cloudflared_tag.outputs.tag }}
          body: |
            Automated sync of cloudflared official release
            - Version: ${{ steps.cloudflared_tag.outputs.tag }}
            - Pure official binaries renamed for ko main project use.
          files: |
            bot-linux-amd64
            bot-linux-arm64
